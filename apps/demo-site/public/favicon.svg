<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="45%" stop-color="#FF7A00" />
      <stop offset="85%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#7928CA" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with glow -->
  <circle cx="50" cy="50" r="42" fill="url(#sunGlow)" filter="url(#glow)"/>
  <!-- Solar flare bursts -->
  <g stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="4" x2="50" y2="12" />
    <line x1="50" y1="88" x2="50" y2="96" />
    <line x1="4" y1="50" x2="12" y2="50" />
    <line x1="88" y1="50" x2="96" y2="50" />
    <line x1="17" y1="17" x2="23" y2="23" />
    <line x1="77" y1="77" x2="83" y2="83" />
    <line x1="17" y1="83" x2="23" y2="77" />
    <line x1="77" y1="23" x2="83" y2="17" />
  </g>
  <!-- Inti "I" emblem -->
  <text x="50" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">I</text>
  <!-- Solar spark -->
  <circle cx="68" cy="32" r="5" fill="#FFE600" />
</svg>
