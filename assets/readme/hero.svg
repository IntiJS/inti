<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-labelledby="t d">
<title id="t">Inti.js</title>
<desc id="d">Inti.js: AI for any CMS, without changing the CMS. For Astro sites: edit content on the rendered page and Inti writes it back to the CMS it came from. Adapters for WordPress, Kitsuden, Strapi and Keystatic read and write; Contentful and Sanity only read. Start with npm create inti@latest.</desc>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
<rect x="1" y="1" width="1198" height="596" rx="28" fill="#0f1520" stroke="#2a3446" stroke-width="2"/>
<circle cx="80" cy="86" r="18" fill="#fbbf24"/><line x1="105.0" y1="86.0" x2="114.0" y2="86.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><line x1="97.7" y1="103.7" x2="104.0" y2="110.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><line x1="80.0" y1="111.0" x2="80.0" y2="120.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><line x1="62.3" y1="103.7" x2="56.0" y2="110.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><line x1="55.0" y1="86.0" x2="46.0" y2="86.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><line x1="62.3" y1="68.3" x2="56.0" y2="62.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><line x1="80.0" y1="61.0" x2="80.0" y2="52.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><line x1="97.7" y1="68.3" x2="104.0" y2="62.0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
<text class="s" x="130" y="106" font-size="58" font-weight="800" fill="#f1f5f9">Inti<tspan fill="#ff8a4c">.js</tspan></text>
<text class="s" x="56" y="166" font-size="26" font-weight="600" fill="#f1f5f9">AI for any CMS, without changing the CMS.</text>
<text class="s" x="56" y="204" font-size="22" fill="#a8b3c4">For Astro sites: edit on the page, and it is saved back to the CMS it came from.</text>
<rect x="772" y="62" width="372" height="56" rx="14" fill="#161e2c" stroke="#2a3446" stroke-width="2"/>
<text class="m" x="794" y="97" font-size="21" fill="#f1f5f9"><tspan fill="#ff8a4c">$</tspan> npm create inti@latest</text>
<line x1="56" y1="236" x2="1144" y2="236" stroke="#2a3446" stroke-width="2"/>
<text class="s" x="56" y="262" font-size="20" fill="#a8b3c4">Adapters</text>
<rect x="57.0" y="277" width="350.0" height="86" rx="14" fill="#161e2c" stroke="#ff8a4c" stroke-width="2"/>
<text class="s" x="78.0" y="314" font-size="24" font-weight="700" fill="#f1f5f9">WordPress</text>
<text class="m" x="78.0" y="344" font-size="20" fill="#a8b3c4">@intijs/adapter-wordpress</text>
<rect x="425.0" y="277" width="350.0" height="86" rx="14" fill="#161e2c" stroke="#ff8a4c" stroke-width="2"/>
<text class="s" x="446.0" y="314" font-size="24" font-weight="700" fill="#f1f5f9">Kitsuden</text>
<text class="m" x="446.0" y="344" font-size="20" fill="#a8b3c4">@intijs/adapter-kitsuden</text>
<rect x="793.0" y="277" width="350.0" height="86" rx="14" fill="#161e2c" stroke="#ff8a4c" stroke-width="2"/>
<text class="s" x="814.0" y="314" font-size="24" font-weight="700" fill="#f1f5f9">Strapi</text>
<text class="m" x="814.0" y="344" font-size="20" fill="#a8b3c4">@intijs/adapter-strapi</text>
<rect x="57.0" y="381" width="350.0" height="86" rx="14" fill="#161e2c" stroke="#ff8a4c" stroke-width="2"/>
<text class="s" x="78.0" y="418" font-size="24" font-weight="700" fill="#f1f5f9">Keystatic</text>
<text class="m" x="78.0" y="448" font-size="20" fill="#a8b3c4">@intijs/adapter-keystatic</text>
<rect x="425.0" y="381" width="350.0" height="86" rx="14" fill="#161e2c" stroke="#a8b3c4" stroke-width="2" stroke-dasharray="7 6"/>
<text class="s" x="446.0" y="418" font-size="24" font-weight="700" fill="#f1f5f9">Contentful</text>
<text class="m" x="446.0" y="448" font-size="20" fill="#a8b3c4">@intijs/adapter-contentful</text>
<rect x="793.0" y="381" width="350.0" height="86" rx="14" fill="#161e2c" stroke="#a8b3c4" stroke-width="2" stroke-dasharray="7 6"/>
<text class="s" x="814.0" y="418" font-size="24" font-weight="700" fill="#f1f5f9">Sanity</text>
<text class="m" x="814.0" y="448" font-size="20" fill="#a8b3c4">@intijs/adapter-sanity</text>
<rect x="57" y="497" width="34" height="22" rx="6" fill="none" stroke="#ff8a4c" stroke-width="2"/>
<text class="s" x="102" y="514" font-size="20" fill="#f1f5f9">read and write back</text>
<rect x="321" y="497" width="34" height="22" rx="6" fill="none" stroke="#a8b3c4" stroke-width="2" stroke-dasharray="6 5"/>
<text class="s" x="366" y="514" font-size="20" fill="#f1f5f9">read only, for now</text>
<text class="s" x="1144" y="514" font-size="20" text-anchor="end" fill="#a8b3c4">No CMS yet? A local JSON store.</text>
<text class="s" x="56" y="558" font-size="20" fill="#a8b3c4">Any CMS: implement <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#f1f5f9">WritableAdapter</tspan></text>
<text class="m" x="1144" y="558" font-size="20" text-anchor="end" fill="#a8b3c4">MIT · v0.1.0 beta · Astro 5, 6, 7</text>
</svg>
